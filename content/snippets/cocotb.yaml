# Snippet testbench cocotb untuk workspace (Fase 2 task 7). Ditulis sendiri untuk SmartX.
#
# Setiap snippet: id, title, description, imports (baris import yang dibutuhkan),
# body (kode tingkat modul). Menu "Sisipkan snippet" menambahkan import yang belum ada
# di atas file dan menaruh body di akhir file.
#
# Aturan yang dipakai semua snippet (sama dengan aturan testbench di CONTENT-FORMAT):
# input DUT diubah di sisi turun clock, dan sinyal dibaca setelah ReadOnly() supaya
# tidak balapan dengan DUT. Nama sinyal (dut.clk, dut.in_valid, ...) adalah contoh;
# sesuaikan dengan port desainmu.
snippets:
  - id: clock-reset
    title: Clock dan reset
    description: Jalankan clock lalu tahan reset aktif-tinggi beberapa siklus.
    imports:
      - import cocotb
      - from cocotb.clock import Clock
      - from cocotb.triggers import FallingEdge
    body: |
      async def start_clock_and_reset(dut, period_ns: int = 10, cycles: int = 2) -> None:
          """Clock di dut.clk, reset aktif-tinggi di dut.rst selama `cycles` siklus.

          Kembali di sisi turun clock, siap untuk mengubah input.
          """
          cocotb.start_soon(Clock(dut.clk, period_ns, unit="ns").start())
          dut.rst.value = 1
          for _ in range(cycles):
              await FallingEdge(dut.clk)
          dut.rst.value = 0
          await FallingEdge(dut.clk)

  - id: valid-ready-driver
    title: Driver valid/ready
    description: Mengirim data lewat antarmuka valid/ready dan menunggu sampai diterima.
    imports:
      - from cocotb.triggers import FallingEdge, ReadOnly
    body: |
      class ValidReadyDriver:
          """Mengirim data lewat valid/ready. Panggil send() di sisi turun clock.

          Buat driver *sebelum* reset: konstruktornya menaruh valid = 0, sehingga DUT
          tidak membaca X di sisi naik pertama setelah reset (Icarus memakai X,
          Verilator diam-diam memakai 0).
          """

          def __init__(self, clk, valid, ready, data) -> None:
              self.clk, self.valid, self.ready, self.data = clk, valid, ready, data
              self.valid.value = 0

          async def send(self, value: int) -> int:
              """Tahan valid dan data sampai ready = 1 di sisi naik; kembali di sisi turun.

              Mengembalikan jumlah siklus menunggu (0 = langsung diterima).
              """
              self.valid.value = 1
              self.data.value = value
              waited = 0
              while True:
                  await ReadOnly()  # nilai ready yang akan dilihat DUT di sisi naik berikutnya
                  accepted = int(self.ready.value) == 1
                  await FallingEdge(self.clk)
                  if accepted:
                      break
                  waited += 1
              self.valid.value = 0
              return waited

  - id: valid-ready-monitor
    title: Monitor valid/ready
    description: Mencatat setiap data yang berpindah (valid dan ready sama-sama 1).
    imports:
      - import cocotb
      - from cocotb.triggers import FallingEdge, ReadOnly
    body: |
      class ValidReadyMonitor:
          """Panggil callback(data) untuk setiap transfer. Buat setelah reset selesai."""

          def __init__(self, clk, valid, ready, data, callback) -> None:
              self.clk, self.valid, self.ready, self.data = clk, valid, ready, data
              self.callback = callback
              cocotb.start_soon(self._run())

          async def _run(self) -> None:
              while True:
                  await FallingEdge(self.clk)
                  await ReadOnly()  # setelah semua input di sisi turun ini diubah
                  if int(self.valid.value) == 1 and int(self.ready.value) == 1:
                      self.callback(int(self.data.value))

  - id: backpressure
    title: Backpressure acak
    description: Ubah sinyal ready penerima secara acak untuk menguji jalur tahan (stall).
    imports:
      - from cocotb.triggers import FallingEdge
    body: |
      async def random_ready(clk, ready, rng, probability: float = 0.7) -> None:
          """Setiap sisi turun, ready = 1 dengan peluang `probability`. Jalankan dengan
          cocotb.start_soon(random_ready(...))."""
          while True:
              await FallingEdge(clk)
              ready.value = int(rng.random() < probability)

  - id: scoreboard
    title: Scoreboard
    description: Bandingkan keluaran DUT dengan urutan data yang diharapkan.
    imports:
      - from collections import deque
    body: |
      class Scoreboard:
          """expect() untuk setiap data yang dikirim, got() untuk setiap data yang keluar,
          check() di akhir test."""

          def __init__(self) -> None:
              self.expected: deque[int] = deque()
              self.errors: list[str] = []
              self.checked = 0

          def expect(self, value: int) -> None:
              self.expected.append(value)

          def got(self, value: int) -> None:
              if not self.expected:
                  self.errors.append(f"data tak terduga: {value}")
                  return
              want = self.expected.popleft()
              self.checked += 1
              if value != want:
                  self.errors.append(f"transaksi ke-{self.checked}: dapat {value}, seharusnya {want}")

          def check(self) -> None:
              assert not self.errors, "; ".join(self.errors[:5])
              assert not self.expected, f"{len(self.expected)} data tidak pernah keluar dari DUT"

  - id: coverage
    title: Coverage sederhana
    description: Hitung kasus yang sudah teruji dan laporkan yang belum pernah terjadi.
    imports: []
    body: |
      class Coverage:
          """Coverage fungsional tanpa pustaka tambahan: sebut semua kasus (bin) di awal,
          hit() saat kasus terjadi, check() di akhir test."""

          def __init__(self, *bins: str) -> None:
              self.hits = {name: 0 for name in bins}

          def hit(self, name: str) -> None:
              self.hits[name] += 1

          def check(self) -> None:
              missed = [name for name, count in self.hits.items() if count == 0]
              assert not missed, f"kasus belum teruji: {', '.join(missed)}"

  - id: random-test
    title: Test acak dengan seed
    description: Contoh test lengkap yang memakai snippet lain; kirim data acak dan cek dengan scoreboard.
    imports:
      - import random
      - import cocotb
      - from cocotb.triggers import FallingEdge
    body: |
      @cocotb.test()
      async def random_stream(dut):
          """Butuh snippet: clock-reset, valid-ready-driver, valid-ready-monitor,
          backpressure, scoreboard, coverage."""
          rng = random.Random(1234)  # seed tetap: kegagalan bisa diulang persis
          # Semua input DUT diberi nilai sebelum reset dilepas (lihat ValidReadyDriver).
          driver = ValidReadyDriver(dut.clk, dut.in_valid, dut.in_ready, dut.in_data)
          dut.out_ready.value = 1
          await start_clock_and_reset(dut)
          scoreboard = Scoreboard()
          coverage = Coverage("stall", "no_stall")

          def on_output(value: int) -> None:
              scoreboard.got(value)

          ValidReadyMonitor(dut.clk, dut.out_valid, dut.out_ready, dut.out_data, on_output)
          cocotb.start_soon(random_ready(dut.clk, dut.out_ready, rng))
          for _ in range(200):
              value = rng.randrange(256)
              scoreboard.expect(value)
              waited = await driver.send(value)
              coverage.hit("stall" if waited else "no_stall")
          for _ in range(20):  # beri waktu data terakhir keluar
              await FallingEdge(dut.clk)
          scoreboard.check()
          coverage.check()
