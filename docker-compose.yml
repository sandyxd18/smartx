# Development stack. Start with `make dev` (it sets SMARTX_HOST_DIR), then open
# http://127.0.0.1:8080. Job containers are started by the backend through the host's
# Docker daemon, so they need host paths for their bind mounts (SMARTX_HOST_*).
name: smartx

services:
  backend:
    build: ./backend
    command:
      - uvicorn
      - --factory
      - app.main:create_app
      - --host=0.0.0.0
      - --port=8000
      - --reload
      - --reload-dir=/app/app
    env_file:
      - path: .env
        required: false
    environment:
      SMARTX_DATA_DIR: /data
      SMARTX_CONTENT_DIR: /content
      SMARTX_HOST_DATA_DIR: ${SMARTX_HOST_DIR:?jalankan lewat 'make dev'}/data
      SMARTX_HOST_CONTENT_DIR: ${SMARTX_HOST_DIR}/content
      SMARTX_TOOLS_DIR: /tools
      SMARTX_HOST_TOOLS_DIR: ${SMARTX_HOST_DIR}/tools
      # File change events do not cross Docker Desktop bind mounts from Windows.
      WATCHFILES_FORCE_POLLING: "true"
    volumes:
      # Docker socket = root on the host. Only the backend gets it, never a job container.
      - /var/run/docker.sock:/var/run/docker.sock
      - ./backend:/app
      - ./content:/content:ro
      - ./tools:/tools:ro
      - ./data:/data
    # Not published: only the frontend proxy talks to the backend.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 5s

  frontend:
    build: ./frontend
    environment:
      SMARTX_BIND: 0.0.0.0
      SMARTX_PORT: "8080"
      SMARTX_API_URL: http://backend:8000
      SMARTX_WATCH_POLLING: "1"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      # Published on localhost only (SPEC: single user, no auth).
      - "${SMARTX_BIND:-127.0.0.1}:${SMARTX_PORT:-8080}:8080"
    depends_on:
      backend:
        condition: service_healthy
